  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Rubik:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <script>
    (function () {
      var r = document.documentElement;
      var off = /[?&]static/.test(location.search) || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      r.classList.add(off ? 'motion-off' : 'js-motion');
      // Safety net: never leave content hidden if scripts fail to start.
      setTimeout(function () { if (!window.FF || !window.FF.inited) { r.classList.remove('js-motion'); r.classList.add('motion-off'); } }, 4000);
    })();
  </script>
  <link rel="stylesheet" href="js/vendor/lenis.css">
